# Traefik (Dokploy) dynamic config: /etc/dokploy/traefik/dynamic/expecto-api.yml
# Rides on desk.expecto-academy.uz (already points at this server) so no new DNS record is needed.
# Only /api/bookings goes to the booking API; everything else (the desk's own /api/health too) stays with the desk app.
http:
  routers:
    expecto-api-websecure:
      rule: Host(`desk.expecto-academy.uz`) && Path(`/api/bookings`)
      priority: 1000
      service: expecto-api
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
  services:
    expecto-api:
      loadBalancer:
        servers:
          - url: http://172.17.0.1:8790
        passHostHeader: true
